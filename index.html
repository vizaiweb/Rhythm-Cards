<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>節奏卡片 · 固定卡槽</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #1a2639, #0b0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 1.5rem;
        }
        .app {
            max-width: 1200px;
            width: 100%;
        }
        .app-title {
            color: #d4c9b8;
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 1.2rem;
            opacity: 0.5;
        }
        .app-title span {
            color: #f7c68b;
        }

        /* ============================================================
           卡槽容器：固定寬度，flex 排列
           ============================================================ */
        .slot-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: flex-start;
        }

        /* ============================================================
           卡槽：固定尺寸（跟圓點版一樣的寬度）
           ============================================================ */
        .slot {
            flex: 0 0 230px;
            /* 固定寬度，不縮放 */
            background: rgba(26, 38, 60, 0.5);
            border-radius: 1.2rem;
            padding: 0.6rem 0.7rem 0.7rem;
            border: 1px solid rgba(255, 215, 150, 0.06);
            box-shadow: 0 6px 16px -6px #00000066;
        }
        .slot-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }
        .slot-number {
            color: #8a7e6b;
            font-size: 0.55rem;
            font-weight: 600;
            background: rgba(255, 215, 150, 0.08);
            padding: 0.05rem 0.6rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 150, 0.06);
            letter-spacing: 0.5px;
        }
        .slot-status {
            font-size: 0.5rem;
            color: #6fcf97;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
        }
        .slot-status.inactive {
            color: #6b7a93;
        }

        /* ============================================================
           4x4 格子矩陣（固定大小）
           ============================================================ */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 3px;
        }
        .cell {
            aspect-ratio: 1 / 1;
            background: rgba(50, 60, 80, 0.4);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.12s ease, transform 0.08s ease;
            cursor: pointer;
            min-height: 32px;
        }
        .cell:hover {
            transform: scale(1.05);
            border-color: rgba(255, 215, 150, 0.15);
        }
        .cell.accent {
            background: #d48c4a;
            border-color: #f7c68b66;
            box-shadow: 0 0 10px #f7b87e33;
        }
        .cell.light {
            background: rgba(50, 60, 80, 0.5);
            border-color: rgba(255, 255, 255, 0.02);
        }

        /* ============================================================
           行標記
           ============================================================ */
        .row-label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.15rem;
            padding-left: 0.1rem;
        }
        .row-label .beat-number {
            color: #5a6a7a;
            font-size: 0.45rem;
            font-weight: 300;
            min-width: 12px;
            letter-spacing: 0.2px;
        }
        .row-label .beat-hint {
            color: #7a8a7a;
            font-size: 0.4rem;
            font-family: monospace;
            letter-spacing: 0.3px;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.02rem 0.3rem;
            border-radius: 12px;
            opacity: 0.6;
        }

        /* ============================================================
           底部提示
           ============================================================ */
        .footer-hint {
            color: #5a6a6a;
            font-size: 0.6rem;
            text-align: center;
            margin-top: 1.5rem;
            letter-spacing: 0.5px;
            opacity: 0.5;
        }
        .footer-hint strong {
            color: #7a8a7a;
            font-weight: 400;
        }

        /* ============================================================
           響應式：窄螢幕改為 2 欄
           ============================================================ */
        @media (max-width: 820px) {
            .slot {
                flex: 0 0 calc(50% - 0.4rem);
            }
        }
        @media (max-width: 500px) {
            body {
                padding: 0.8rem;
            }
            .slot {
                flex: 0 0 100%;
                padding: 0.5rem;
                border-radius: 0.8rem;
            }
            .cell {
                min-height: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="app-title">🥁 <span>節奏卡片</span> · 固定卡槽</div>

        <!-- ============================================================
            卡槽行
            ============================================================ -->
        <div class="slot-row">

            <!-- 卡槽 ① -->
            <div class="slot">
                <div class="slot-header">
                    <span class="slot-number">①</span>
                    <span class="slot-status">✓</span>
                </div>
                <div class="grid">
                    <div class="cell accent" data-row="0" data-col="0"></div>
                    <div class="cell light" data-row="0" data-col="1"></div>
                    <div class="cell light" data-row="0" data-col="2"></div>
                    <div class="cell light" data-row="0" data-col="3"></div>
                    <div class="cell light" data-row="1" data-col="0"></div>
                    <div class="cell accent" data-row="1" data-col="1"></div>
                    <div class="cell light" data-row="1" data-col="2"></div>
                    <div class="cell light" data-row="1" data-col="3"></div>
                    <div class="cell light" data-row="2" data-col="0"></div>
                    <div class="cell light" data-row="2" data-col="1"></div>
                    <div class="cell accent" data-row="2" data-col="2"></div>
                    <div class="cell light" data-row="2" data-col="3"></div>
                    <div class="cell light" data-row="3" data-col="0"></div>
                    <div class="cell light" data-row="3" data-col="1"></div>
                    <div class="cell light" data-row="3" data-col="2"></div>
                    <div class="cell accent" data-row="3" data-col="3"></div>
                </div>
                <div class="row-label">
                    <span class="beat-number">1</span>
                    <span class="beat-hint">◉ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">2</span>
                    <span class="beat-hint">○ ◉ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">3</span>
                    <span class="beat-hint">○ ○ ◉ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">4</span>
                    <span class="beat-hint">○ ○ ○ ◉</span>
                </div>
            </div>

            <!-- 卡槽 ② -->
            <div class="slot">
                <div class="slot-header">
                    <span class="slot-number">②</span>
                    <span class="slot-status inactive">✕</span>
                </div>
                <div class="grid">
                    <div class="cell light" data-row="0" data-col="0"></div>
                    <div class="cell light" data-row="0" data-col="1"></div>
                    <div class="cell light" data-row="0" data-col="2"></div>
                    <div class="cell light" data-row="0" data-col="3"></div>
                    <div class="cell light" data-row="1" data-col="0"></div>
                    <div class="cell light" data-row="1" data-col="1"></div>
                    <div class="cell light" data-row="1" data-col="2"></div>
                    <div class="cell light" data-row="1" data-col="3"></div>
                    <div class="cell light" data-row="2" data-col="0"></div>
                    <div class="cell light" data-row="2" data-col="1"></div>
                    <div class="cell light" data-row="2" data-col="2"></div>
                    <div class="cell light" data-row="2" data-col="3"></div>
                    <div class="cell light" data-row="3" data-col="0"></div>
                    <div class="cell light" data-row="3" data-col="1"></div>
                    <div class="cell light" data-row="3" data-col="2"></div>
                    <div class="cell light" data-row="3" data-col="3"></div>
                </div>
                <div class="row-label">
                    <span class="beat-number">1</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">2</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">3</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">4</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
            </div>

            <!-- 卡槽 ③ -->
            <div class="slot">
                <div class="slot-header">
                    <span class="slot-number">③</span>
                    <span class="slot-status">✓</span>
                </div>
                <div class="grid">
                    <div class="cell accent" data-row="0" data-col="0"></div>
                    <div class="cell accent" data-row="0" data-col="1"></div>
                    <div class="cell light" data-row="0" data-col="2"></div>
                    <div class="cell light" data-row="0" data-col="3"></div>
                    <div class="cell accent" data-row="1" data-col="0"></div>
                    <div class="cell light" data-row="1" data-col="1"></div>
                    <div class="cell accent" data-row="1" data-col="2"></div>
                    <div class="cell light" data-row="1" data-col="3"></div>
                    <div class="cell light" data-row="2" data-col="0"></div>
                    <div class="cell accent" data-row="2" data-col="1"></div>
                    <div class="cell accent" data-row="2" data-col="2"></div>
                    <div class="cell light" data-row="2" data-col="3"></div>
                    <div class="cell light" data-row="3" data-col="0"></div>
                    <div class="cell accent" data-row="3" data-col="1"></div>
                    <div class="cell light" data-row="3" data-col="2"></div>
                    <div class="cell accent" data-row="3" data-col="3"></div>
                </div>
                <div class="row-label">
                    <span class="beat-number">1</span>
                    <span class="beat-hint">◉ ◉ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">2</span>
                    <span class="beat-hint">◉ ○ ◉ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">3</span>
                    <span class="beat-hint">○ ◉ ◉ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">4</span>
                    <span class="beat-hint">○ ◉ ○ ◉</span>
                </div>
            </div>

            <!-- 卡槽 ④ -->
            <div class="slot">
                <div class="slot-header">
                    <span class="slot-number">④</span>
                    <span class="slot-status inactive">✕</span>
                </div>
                <div class="grid">
                    <div class="cell light" data-row="0" data-col="0"></div>
                    <div class="cell light" data-row="0" data-col="1"></div>
                    <div class="cell light" data-row="0" data-col="2"></div>
                    <div class="cell light" data-row="0" data-col="3"></div>
                    <div class="cell light" data-row="1" data-col="0"></div>
                    <div class="cell light" data-row="1" data-col="1"></div>
                    <div class="cell light" data-row="1" data-col="2"></div>
                    <div class="cell light" data-row="1" data-col="3"></div>
                    <div class="cell light" data-row="2" data-col="0"></div>
                    <div class="cell light" data-row="2" data-col="1"></div>
                    <div class="cell light" data-row="2" data-col="2"></div>
                    <div class="cell light" data-row="2" data-col="3"></div>
                    <div class="cell light" data-row="3" data-col="0"></div>
                    <div class="cell light" data-row="3" data-col="1"></div>
                    <div class="cell light" data-row="3" data-col="2"></div>
                    <div class="cell light" data-row="3" data-col="3"></div>
                </div>
                <div class="row-label">
                    <span class="beat-number">1</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">2</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">3</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
                <div class="row-label">
                    <span class="beat-number">4</span>
                    <span class="beat-hint">○ ○ ○ ○</span>
                </div>
            </div>

        </div><!-- /slot-row -->

        <div class="footer-hint">
            🟨 金色 = 重拍 &nbsp;·&nbsp; ⬜ 灰色 = 輕拍 &nbsp;·&nbsp; <strong>點擊格子切換</strong>
        </div>
    </div>

    <script>
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', function(e) {
                e.stopPropagation();
                if (this.classList.contains('accent')) {
                    this.classList.remove('accent');
                    this.classList.add('light');
                } else {
                    this.classList.remove('light');
                    this.classList.add('accent');
                }
                updateRowHint(this);
            });
        });

        function updateRowHint(cell) {
            const grid = cell.closest('.grid');
            if (!grid) return;
            const row = parseInt(cell.dataset.row);
            if (isNaN(row)) return;

            const rowCells = grid.querySelectorAll(`.cell[data-row="${row}"]`);
            if (rowCells.length !== 4) return;

            const slot = grid.closest('.slot');
            const labels = slot.querySelectorAll('.row-label');
            if (row >= labels.length) return;

            const hintSpan = labels[row].querySelector('.beat-hint');
            if (!hintSpan) return;

            let pattern = '';
            rowCells.forEach((c, idx) => {
                if (c.classList.contains('accent')) pattern += '◉';
                else pattern += '○';
                if (idx < rowCells.length - 1) pattern += ' ';
            });
            hintSpan.textContent = pattern;
        }
    </script>
</body>
</html>
