<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>節奏卡片 · 手機全顯示版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a2639;min-height:100vh;display:flex;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:10px 10px 100px;color:#d4c9b8}
.app{max-width:1100px;width:100%}
.title{text-align:center;margin-bottom:12px;font-size:1.1rem;color:#f7c68b}
.title span{color:#d4c9b8;font-weight:300}

/* 頂部控制列優化 */
.top-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;background:rgba(18,28,46,.6);backdrop-filter:blur(10px);border-radius:20px;padding:8px 12px;margin-bottom:12px;border:1px solid rgba(255,215,150,.06)}
.control-group{display:flex;align-items:center;gap:4px 6px}
.control-group label{color:#8a9a8a;font-size:11px}
.control-group input[type=range]{width:60px;height:3px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,#4a5a6a,#f7c68b);border-radius:4px;outline:none}
.control-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;background:#f7e1c0;border-radius:50%;box-shadow:0 0 10px #f7b87e66;border:1px solid #ffdbb5;cursor:pointer}
.control-value{color:#f7dec0;font-size:12px;font-weight:600;min-width:24px;text-align:center}
.control-group select{padding:4px 6px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,150,.1);color:#b8ad9a;font-size:11px;cursor:pointer;outline:none;font-family:inherit}
.btn{padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#b8ad9a;cursor:pointer;font-size:12px;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:rgba(255,255,255,.08);color:#f7dec0}
.btn.playing{background:rgba(200,70,70,.15);border-color:rgba(200,70,70,.2);color:#d46a6a}
.metro-btn{background:rgba(100,100,100,.3);border:none;color:#8a8a8a;padding:3px 10px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .25s}
.metro-btn.on{background:rgba(70,200,100,.25);color:#7acf8a;box-shadow:0 0 16px rgba(70,200,100,.15)}
.status-text{padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.03);font-size:12px;color:#6a7a7a;min-width:70px;text-align:center;transition:all .2s}
.status-text.playing{color:#f7c68b;border-color:#f7c68b44}

/* 上方獨立一行的卡槽啟用鍵 */
.slot-toggles-bar {display:flex;justify-content:center;gap:6px;margin-bottom:12px;padding:6px;background:rgba(18,28,46,.6);backdrop-filter:blur(10px);border-radius:16px;border:1px solid rgba(255,215,150,.06)}
.top-toggle-btn {display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 8px;border-radius:20px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,215,150,.04);background:rgba(255,215,150,.04);color:#8a7e6b;user-select:none;flex:1;max-width:80px}
.top-toggle-btn:hover {background:rgba(255,215,150,.08)}
.top-toggle-btn.active {border-color:rgba(61,126,201,.5);background:rgba(61,126,201,.1);color:#f7dec0}
.top-toggle-btn.inactive {opacity:0.4;filter:grayscale(1)}
.top-toggle-btn .card-num {font-size:14px;font-weight:bold;margin-bottom:0}
.top-toggle-btn .card-status {font-size:10px;color:#6fcf97;background:rgba(0,0,0,.2);padding:1px 4px;border-radius:10px}
.top-toggle-btn.inactive .card-status {color:#6b7a93}

/* 垂直排列的卡片行 */
.slot-row-container{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.slot-row{display:flex;align-items:stretch;background:rgba(26,38,60,.4);border-radius:12px;padding:6px;border:1px solid rgba(255,215,150,.06);transition:opacity .2s}
.slot-row.disabled{opacity:.35}
.slot-row.disabled .frame{pointer-events:none}

/* 右側圖框容器 - 移除滾動，強制平分 */
.frames-wrapper{display:flex;gap:4px;flex:1;width:100%}

/* 單個圖框（一拍） - 取消 min-width，允許壓縮 */
.frame{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border:1.5px solid #f7c68b;border-radius:6px;padding:3px;background:rgba(16,24,42,.6);transition:all .2s;position:relative}
.frame.playing-frame{border-color:#ffe1b0;box-shadow:0 0 10px rgba(247,198,139,.4);background:rgba(247,198,139,.1)}

/* 圖片上傳區 */
.image-area{flex:1;min-height:50px;background:rgba(0,0,0,.2);border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:background .2s}
.image-area:hover{background:rgba(0,0,0,.4)}
.image-area img{width:100%;height:100%;object-fit:contain;display:block}
.image-area .placeholder{font-size:9px;color:#5a6a7a;text-align:center;line-height:1.2}
.delete-img-btn{position:absolute;top:2px;right:2px;width:14px;height:14px;background:rgba(200,80,60,.8);color:#fff;border:none;border-radius:50%;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:10}
.image-area:hover .delete-img-btn{display:flex}
.delete-img-btn:hover{background:rgba(200,80,60,1)}

/* 圖框內的操作區 */
.frame-controls{display:flex;flex-direction:column;gap:2px}
.drop-dot{width:14px;height:14px;border-radius:50%;background:#3d7ec9;border:1.5px solid #5f9cf0;cursor:grab;transition:all .15s ease;box-shadow:0 0 4px rgba(61,126,201,.3);position:absolute;top:4px;left:4px;z-index:5}
.drop-dot:hover{transform:scale(1.1);box-shadow:0 0 8px rgba(61,126,201,.6)}
.drop-dot.drag-over{background:#5fc8c8;border-color:#7ae0e0;box-shadow:0 0 10px rgba(95,200,200,.5);transform:scale(1.2)}
.drop-dot.active{background:#7ac8ff;border-color:#a8e0ff;box-shadow:0 0 15px rgba(122,200,255,.8);transform:scale(1.15);transition:all .05s ease}

.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;flex:1}
.cell{aspect-ratio:1;background:rgba(50,60,80,.6);border-radius:2px;border:1px solid rgba(255,255,255,.03);cursor:pointer;transition:all .08s ease;min-height:16px;position:relative;display:flex;align-items:center;justify-content:center}

/* --- 格子三態 --- */
.cell.light{background:rgba(50,60,80,.6)}
.cell.accent{background:#d48c4a;border-color:#f7c68b66;box-shadow:0 0 4px rgba(247,198,139,.2)}
.cell.sustain{background:rgba(50,60,80,.6)}
.cell.sustain::after{content:''; position:absolute;width:100%; height:3px; background:#d48c4a; box-shadow:0 0 3px rgba(212,140,74,.5);}

/* 連音與合併樣式 */
.cell.triplet{background:#3d7ec9;border-color:#5f9cf0}
.cell.quintuplet{background:#c9a84c;border-color:#eac761}
.cell.sextuplet{background:#3ba87a;border-color:#4fd3a0}
.cell.septuplet{background:#9b6fc0;border-color:#c28dee}
.cell.octuplet{background:#c95f5f;border-color:#e67a7a}
.cell.merge-start{border-left:2px solid #f7c68b;border-radius:2px 0 0 2px}
.cell.merge-end{border-right:2px solid #f7c68b;border-radius:0 2px 2px 0}
.cell .tuplet-label{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);font-size:7px;color:#fff;opacity:.9;font-weight:700;pointer-events:none;text-shadow:0 0 1px #000}

/* 播放高亮 */
.cell.playing{transform:scale(1.1);box-shadow:0 0 8px #f7c68b;border-color:#ffe1b0;background:#f7c68b !important;z-index:2}
.cell.playing::after{background:#1a2639}
.cell.drag-highlight{box-shadow:0 0 8px #3d7ec9,inset 0 0 8px rgba(61,126,201,.3);border-color:#5f9cf0;transform:scale(1.05)}

/* 底部工具列與彈窗 */
.toolbar{position:fixed;bottom:0;left:0;right:0;background:rgba(12,18,30,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(255,215,150,.08);padding:6px 12px;display:flex;flex-direction:column;gap:4px;z-index:100}
.toolbar-label{color:#8a9a8a;font-size:10px;text-align:center;opacity:.5}
.toolbar-group{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.tool-btn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);color:#b8ad9a;font-size:12px;cursor:grab;transition:all .2s;display:inline-flex;align-items:center;gap:4px;min-height:30px;user-select:none}
.tool-btn:hover{background:rgba(255,255,255,.08);color:#f7dec0}
.tool-btn.active{background:rgba(70,200,200,.15);border-color:#5fc8c8;color:#7ac8c8}
.drag-ghost{position:fixed;pointer-events:none;z-index:9999;background:rgba(70,200,200,.15);border:1.5px solid #5fc8c8;border-radius:20px;padding:4px 12px;font-size:12px;color:#7ac8c8;backdrop-filter:blur(8px);box-shadow:0 4px 15px rgba(0,0,0,.5);opacity:0;transition:opacity .1s;white-space:nowrap}
.drag-ghost.visible{opacity:.9}

.rhythm-picker,.tuplet-picker{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10000;background:rgba(16,24,42,.96);backdrop-filter:blur(16px);border:1px solid rgba(255,215,150,.15);border-radius:16px;padding:16px 20px;box-shadow:0 30px 60px rgba(0,0,0,.7);color:#d4c9b8;width:90%;max-width:360px}
.picker-title{font-size:14px;font-weight:500;color:#f7dec0;text-align:center;margin-bottom:8px}
.picker-subtitle{font-size:10px;color:#6a7a7a;text-align:center;margin-bottom:8px}
.picker-section-label{font-size:10px;color:#6a7a7a;text-align:center;padding:4px 0;border-top:1px solid rgba(255,215,150,.05);margin-top:4px}
.rhythm-picker .picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tuplet-picker .picker-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.picker-item{padding:6px 8px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid rgba(255,215,150,.06);cursor:pointer;text-align:center;font-size:12px;transition:all .15s;color:#b8ad9a}
.picker-item:hover{background:rgba(255,215,150,.1);border-color:rgba(255,215,150,.2);color:#f7dec0}
.picker-cancel{margin-top:8px;text-align:center;padding:6px;border-radius:20px;background:rgba(200,80,60,.1);border:1px solid rgba(200,80,60,.1);cursor:pointer;font-size:12px;color:#8a6a5a;transition:all .15s}
.picker-cancel:hover{background:rgba(200,80,60,.2)}
.picker-item.merge-up{border-color:rgba(70,200,200,.15);color:#7ac8c8}
.picker-item.merge-down{border-color:rgba(247,198,139,.15);color:#f7c68b}
.picker-item.disabled{opacity:.3;cursor:not-allowed}

/* 桌機螢幕微調 (回復寬裕的間距) */
@media(min-width:768px){
    body{padding:20px 20px 120px}
    .title{font-size:1.2rem}
    .top-bar{gap:8px 16px;padding:10px 20px;border-radius:30px}
    .control-group input[type=range]{width:70px}
    .slot-toggles-bar{gap:16px;padding:10px}
    .top-toggle-btn{padding:6px 18px;max-width:none}
    .top-toggle-btn .card-num{font-size:16px}
    .top-toggle-btn .card-status{font-size:12px;padding:2px 8px}
    .slot-row-container{gap:16px}
    .slot-row{padding:12px;border-radius:16px}
    .frames-wrapper{gap:10px}
    .frame{border-width:2px;padding:6px;border-radius:8px;gap:6px}
    .image-area{border-radius:4px;min-height:60px}
    .image-area .placeholder{font-size:11px}
    .drop-dot{width:16px;height:16px;top:auto;left:auto;position:relative;border-width:2px;margin-right:4px}
    .frame-controls{flex-direction:row;align-items:center;gap:4px}
    .grid{gap:2px}
    .cell{border-radius:3px;min-height:20px}
    .cell.sustain::after{height:4px}
    .cell .tuplet-label{font-size:8px;bottom:0}
    .tool-btn{padding:6px 16px;border-radius:30px;min-height:34px;font-size:13px}
    .rhythm-picker,.tuplet-picker{max-width:400px}
    .picker-title{font-size:15px}
    .picker-item{font-size:13px;padding:8px 12px}
}
</style>
</head>
<body>

<div class="app">
    <div class="title">🥁 <span>節奏卡片</span> · 手機全顯示版</div>

    <div class="top-bar">
        <div class="control-group">
            <label>BPM</label>
            <input type="range" id="bpmSlider" min="40" max="200" value="120" step="1">
            <span class="control-value" id="bpmDisplay">120</span>
        </div>
        <div class="control-group">
            <label>🔊</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="80" step="1">
            <span class="control-value" id="volumeDisplay">80%</span>
        </div>
        <div class="control-group">
            <label>🔔</label>
            <button class="metro-btn" id="metroToggleBtn">關</button>
        </div>
        <div class="control-group">
            <label>🔊</label>
            <input type="range" id="metroVolumeSlider" min="0" max="100" value="50" step="1">
            <span class="control-value" id="metroVolDisplay">50%</span>
        </div>
        <div class="control-group">
            <label>次數</label>
            <select id="loopCountSelect">
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="16" selected>16</option>
                <option value="32">32</option>
                <option value="64">64</option>
            </select>
        </div>
        <button class="btn" id="randomBtn">🎲 隨機</button>
        <button class="btn" id="playBtn">▶ <span id="playLabel">播放</span></button>
        <button class="btn" id="clearBtn">🗑 清空</button>
        <button class="btn" id="selectAllBtn">☑ 全選</button>
        <span class="status-text" id="statusText">⏸ 就緒</span>
    </div>

    <div class="slot-toggles-bar" id="slotTogglesBar"></div>

    <div class="slot-row-container" id="slotRowContainer"></div>

    <div class="toolbar">
        <div class="toolbar-label">⬇️ 拖拉「常符」到藍色圓點 | 拖拉「連音組合」到格子</div>
        <div class="toolbar-group">
            <button class="tool-btn" id="rhythmToolBtn">🎵 常符</button>
            <button class="tool-btn" id="tupletToolBtn">🔀 連音組合</button>
        </div>
    </div>

    <div class="drag-ghost" id="dragGhost">🎵 常符</div>

    <div class="rhythm-picker" id="rhythmPicker">
        <div class="picker-title">🎵 選擇節奏型</div>
        <div class="picker-grid" id="rhythmPickerGrid"></div>
        <div class="picker-cancel" id="rhythmPickerCancel">✕ 取消</div>
    </div>

    <div class="tuplet-picker" id="tupletPicker">
        <div class="picker-title" id="tupletPickerTitle">🔀 選擇連音</div>
        <div class="picker-subtitle" id="tupletPickerSubtitle">僅影響當前格與上/下一子拍</div>
        <div class="picker-section-label">— 單格連音 —</div>
        <div class="picker-grid" id="tupletPickerGrid"></div>
        <div class="picker-section-label">— 向上合併 —</div>
        <div class="picker-grid" id="mergeUpPickerGrid"></div>
        <div class="picker-section-label">— 向下合併 —</div>
        <div class="picker-grid" id="mergeDownPickerGrid"></div>
        <div class="picker-cancel" id="tupletPickerCancel">✕ 取消</div>
    </div>
</div>

<script>
// ================================================================
// 資料結構與狀態
// ================================================================
var ROWS = 4;
var COLS = 4;
var TOTAL_SLOTS = 4;

var RHYTHM_LIBRARY = [
    ['light', 'light', 'light', 'light'],
    ['accent', 'light', 'light', 'light'],
    ['light', 'accent', 'light', 'light'],
    ['light', 'light', 'accent', 'light'],
    ['light', 'light', 'light', 'accent'],
    ['accent', 'sustain', 'sustain', 'sustain'],
    ['accent', 'sustain', 'light', 'light'],
    ['light', 'light', 'accent', 'sustain'],
    ['accent', 'sustain', 'accent', 'sustain'],
    ['accent', 'accent', 'light', 'light'],
    ['light', 'light', 'accent', 'accent'],
    ['accent', 'accent', 'sustain', 'light'],
    ['accent', 'sustain', 'sustain', 'light'],
    ['light', 'accent', 'sustain', 'sustain'],
    ['accent', 'accent', 'accent', 'sustain'],
    ['accent', 'accent', 'accent', 'accent']
];

var TUPLET_TYPES = [
    { id: 'triplet', label: '3', css: 'triplet' },
    { id: 'quintuplet', label: '5', css: 'quintuplet' },
    { id: 'sextuplet', label: '6', css: 'sextuplet' },
    { id: 'septuplet', label: '7', css: 'septuplet' },
    { id: 'octuplet', label: '8', css: 'octuplet' }
];

var slotData = [];
var slotEnabled = [];
var frameImages = [];

for (var s = 0; s < TOTAL_SLOTS; s++) {
    var grid = [];
    var imgRow = [];
    for (var r = 0; r < ROWS; r++) {
        var row = [];
        for (var c = 0; c < COLS; c++) row.push(0);
        grid.push(row);
        imgRow.push(null);
    }
    slotData.push(grid);
    slotEnabled.push(true);
    frameImages.push(imgRow);
}

var beatTuplets = {};
var mergePairs = {};

var isPlaying = false;
var prepTimerId = null;
var metroTimeoutId = null;
var bpm = 120;
var volume = 0.8;
var metronomeOn = false;
var metroVolume = 0.5;
var loopCount = 16;
var totalPositions = 0;
var metroBeatCounter = 0;

var playState = { isActive: false, events: [], eventIndex: 0, startTime: 0, rafId: null, scheduledNodes: [] };
var rhythmDrag = { isDragging: false, active: false };
var tupletDrag = { isDragging: false, active: false };
var tupletTargetSlot = null, tupletTargetRow = null, tupletTargetCol = null;
var audioCtx = null, masterGain = null, metroGain = null;

// DOM
var slotRowContainer = document.getElementById('slotRowContainer');
var slotTogglesBar = document.getElementById('slotTogglesBar');
var playBtn = document.getElementById('playBtn');
var metroToggleBtn = document.getElementById('metroToggleBtn');
var bpmSlider = document.getElementById('bpmSlider');
var bpmDisplay = document.getElementById('bpmDisplay');
var volumeSlider = document.getElementById('volumeSlider');
var volumeDisplay = document.getElementById('volumeDisplay');
var metroVolumeSlider = document.getElementById('metroVolumeSlider');
var metroVolDisplay = document.getElementById('metroVolDisplay');
var randomBtn = document.getElementById('randomBtn');
var clearBtn = document.getElementById('clearBtn');
var selectAllBtn = document.getElementById('selectAllBtn');
var statusText = document.getElementById('statusText');
var rhythmToolBtn = document.getElementById('rhythmToolBtn');
var tupletToolBtn = document.getElementById('tupletToolBtn');
var dragGhost = document.getElementById('dragGhost');
var rhythmPicker = document.getElementById('rhythmPicker');
var rhythmPickerGrid = document.getElementById('rhythmPickerGrid');
var rhythmPickerCancel = document.getElementById('rhythmPickerCancel');
var tupletPicker = document.getElementById('tupletPicker');
var tupletPickerTitle = document.getElementById('tupletPickerTitle');
var tupletPickerSubtitle = document.getElementById('tupletPickerSubtitle');
var tupletPickerGrid = document.getElementById('tupletPickerGrid');
var mergeUpPickerGrid = document.getElementById('mergeUpPickerGrid');
var mergeDownPickerGrid = document.getElementById('mergeDownPickerGrid');
var tupletPickerCancel = document.getElementById('tupletPickerCancel');
var loopCountSelect = document.getElementById('loopCountSelect');

// ================================================================
// 音效
// ================================================================
function initAudio() {
    if (!audioCtx) {
        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = volume;
        masterGain.connect(audioCtx.destination);
        metroGain = audioCtx.createGain();
        metroGain.gain.value = metroVolume * 0.4;
        metroGain.connect(masterGain);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playKickAtTime(time) {
    try {
        var ctx = initAudio();
        var t = Math.max(ctx.currentTime + 0.001, time);
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(55, t + 0.08);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(t); osc.stop(t + 0.1);

        var bufSize = ctx.sampleRate * 0.04;
        var buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
        var noise = ctx.createBufferSource();
        noise.buffer = buf;
        var ng = ctx.createGain();
        ng.gain.setValueAtTime(0.3, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        noise.connect(ng); ng.connect(masterGain);
        noise.start(t); noise.stop(t + 0.04);

        if (playState.isActive) playState.scheduledNodes.push({ osc, gain, noise, ng });
    } catch (e) {}
}

function playTickAtTime(time) {
    try {
        var ctx = initAudio();
        var t = Math.max(ctx.currentTime + 0.001, time);
        var osc = ctx.createOscillator(); var gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1500, t);
        gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(t); osc.stop(t + 0.04);
        setTimeout(function() { try { osc.disconnect(); gain.disconnect(); } catch(e){} }, 50);
    } catch (e) {}
}

function playMetroAtTime(time) {
    try {
        var ctx = initAudio();
        var t = Math.max(ctx.currentTime + 0.005, time);
        var osc = ctx.createOscillator(); var gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1500, t);
        gain.gain.setValueAtTime(1.0, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        osc.connect(gain); gain.connect(metroGain);
        osc.start(t); osc.stop(t + 0.03);
        setTimeout(function() { try { osc.disconnect(); gain.disconnect(); } catch(e){} }, 50);
    } catch (e) {}
}

// ================================================================
// 連音/合併輔助
// ================================================================
function getCellTuplet(slot, row, col) {
    if (beatTuplets[slot] && beatTuplets[slot][row] && beatTuplets[slot][row][col] !== undefined) return beatTuplets[slot][row][col];
    return null;
}
function getMergePair(slot, row, col) {
    if (!mergePairs[slot]) return null;
    for (var i = 0; i < mergePairs[slot].length; i++) {
        var p = mergePairs[slot][i];
        if ((p.row1 === row && p.col1 === col) || (p.row2 === row && p.col2 === col)) return p;
    }
    return null;
}
function addMergePair(slot, row1, col1, row2, col2, type) {
    if (!mergePairs[slot]) mergePairs[slot] = [];
    for (var i = 0; i < mergePairs[slot].length; i++) {
        var p = mergePairs[slot][i];
        if ((p.row1 === row1 && p.col1 === col1 && p.row2 === row2 && p.col2 === col2) || (p.row1 === row2 && p.col1 === col2 && p.row2 === row1 && p.col2 === col1)) return;
    }
    mergePairs[slot].push({ row1, col1, row2, col2, type });
}
function removeMergePairWithCells(slot, row1, col1, row2, col2) {
    if (!mergePairs[slot]) return false;
    for (var i = 0; i < mergePairs[slot].length; i++) {
        var p = mergePairs[slot][i];
        if ((p.row1 === row1 && p.col1 === col1) || (p.row2 === row1 && p.col2 === col1) || (p.row1 === row2 && p.col1 === col2) || (p.row2 === row2 && p.col2 === col2)) {
            mergePairs[slot].splice(i, 1); if (mergePairs[slot].length === 0) delete mergePairs[slot]; return true;
        }
    }
    return false;
}
function removeMergePair(slot, row, col) {
    if (!mergePairs[slot]) return false;
    for (var i = 0; i < mergePairs[slot].length; i++) {
        var p = mergePairs[slot][i];
        if ((p.row1 === row && p.col1 === col) || (p.row2 === row && p.col2 === col)) {
            mergePairs[slot].splice(i, 1); if (mergePairs[slot].length === 0) delete mergePairs[slot]; return true;
        }
    }
    return false;
}

// ================================================================
// 渲染 (上方啟用鍵 + 三態格子)
// ================================================================
function renderTopToggles() {
    slotTogglesBar.innerHTML = '';
    for (var s = 0; s < TOTAL_SLOTS; s++) {
        var btn = document.createElement('div');
        btn.className = 'top-toggle-btn ' + (slotEnabled[s] ? 'active' : 'inactive');
        btn.innerHTML = '<span class="card-num">' + ['①','②','③','④'][s] + '</span><span class="card-status">' + (slotEnabled[s] ? '啟用' : '停用') + '</span>';
        btn.onclick = (function(idx) {
            return function() { toggleSlot(idx); };
        })(s);
        slotTogglesBar.appendChild(btn);
    }
}

function renderSlots() {
    slotRowContainer.innerHTML = '';
    
    for (var s = 0; s < TOTAL_SLOTS; s++) {
        var enabled = slotEnabled[s];
        var rowEl = document.createElement('div');
        rowEl.className = 'slot-row' + (enabled ? '' : ' disabled');
        rowEl.setAttribute('data-slot', s);

        var framesWrapper = document.createElement('div');
        framesWrapper.className = 'frames-wrapper';

        for (var r = 0; r < ROWS; r++) {
            var frameEl = document.createElement('div');
            frameEl.className = 'frame';
            frameEl.setAttribute('data-slot', s);
            frameEl.setAttribute('data-row', r);

            var imgArea = document.createElement('div');
            imgArea.className = 'image-area';
            
            var fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            
            fileInput.onchange = (function(slotIdx, rowIdx, areaEl) {
                return function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    var reader = new FileReader();
                    reader.onload = function(evt) {
                        frameImages[slotIdx][rowIdx] = evt.target.result;
                        updateImageArea(slotIdx, rowIdx, areaEl);
                    };
                    reader.readAsDataURL(file);
                    this.value = '';
                };
            })(s, r, imgArea);
            
            imgArea.onclick = function(e) {
                if (e.target.classList.contains('delete-img-btn')) return;
                var input = this.querySelector('input[type="file"]');
                if (input) input.click();
            };
            
            imgArea.appendChild(fileInput);
            updateImageArea(s, r, imgArea);

            var controlsEl = document.createElement('div');
            controlsEl.className = 'frame-controls';

            // 藍色圓點 (手機上絕對定位在圖片區左上角)
            var dot = document.createElement('div');
            dot.className = 'drop-dot';
            dot.setAttribute('data-slot', s);
            dot.setAttribute('data-row', r);
            dot.addEventListener('mouseenter', function() { if (rhythmDrag.active) this.classList.add('drag-over'); });
            dot.addEventListener('mouseleave', function() { this.classList.remove('drag-over'); });
            imgArea.appendChild(dot); // 放入圖片區

            var gridEl = document.createElement('div');
            gridEl.className = 'grid';
            for (var c = 0; c < COLS; c++) {
                var cell = document.createElement('div');
                var cellState = slotData[s][r][c];
                var tuplet = getCellTuplet(s, r, c);
                var merge = getMergePair(s, r, c);

                var cellClass = 'cell ';
                if (merge) {
                    var info = TUPLET_TYPES.find(function(t) { return t.id === merge.type; });
                    if (info) cellClass += info.css + ' ';
                    if (r === merge.row1 && c === merge.col1) cellClass += 'merge-start ';
                    else if (r === merge.row2 && c === merge.col2) cellClass += 'merge-end ';
                } else if (tuplet) {
                    var info2 = TUPLET_TYPES.find(function(t) { return t.id === tuplet; });
                    if (info2) cellClass += info2.css + ' ';
                } else {
                    if (cellState === 1) cellClass += 'accent';
                    else if (cellState === 2) cellClass += 'sustain';
                    else cellClass += 'light';
                }
                cell.className = cellClass.trim();
                cell.setAttribute('data-slot', s);
                cell.setAttribute('data-row', r);
                cell.setAttribute('data-col', c);

                var label = document.createElement('span');
                label.className = 'tuplet-label';
                var labelText = '';
                if (merge) { var i3 = TUPLET_TYPES.find(function(t) { return t.id === merge.type; }); labelText = i3 ? ('-' + i3.label + '-') : ''; }
                else if (tuplet) { var i4 = TUPLET_TYPES.find(function(t) { return t.id === tuplet; }); labelText = i4 ? ('-' + i4.label + '-') : ''; }
                if (labelText) { label.textContent = labelText; cell.appendChild(label); }

                cell.onclick = function(e) {
                    e.stopPropagation();
                    if (isPlaying) return;
                    var si = parseInt(this.getAttribute('data-slot'));
                    var ri = parseInt(this.getAttribute('data-row'));
                    var ci = parseInt(this.getAttribute('data-col'));

                    if (getMergePair(si, ri, ci)) {
                        removeMergePair(si, ri, ci);
                        renderSlots();
                        statusText.textContent = '↺ 已清除合併';
                        return;
                    }
                    if (beatTuplets[si] && beatTuplets[si][ri] && beatTuplets[si][ri][ci] !== undefined) {
                        delete beatTuplets[si][ri][ci];
                        if (Object.keys(beatTuplets[si][ri]).length === 0) delete beatTuplets[si][ri];
                        if (Object.keys(beatTuplets[si]).length === 0) delete beatTuplets[si];
                        renderSlots();
                        statusText.textContent = '↺ 已清除連音';
                        return;
                    }
                    
                    var current = slotData[si][ri][ci];
                    slotData[si][ri][ci] = (current + 1) % 3;
                    renderSlots();
                };
                gridEl.appendChild(cell);
            }
            controlsEl.appendChild(gridEl);
            
            frameEl.appendChild(imgArea);
            frameEl.appendChild(controlsEl);
            framesWrapper.appendChild(frameEl);
        }

        rowEl.appendChild(framesWrapper);
        slotRowContainer.appendChild(rowEl);
    }
    updateSelectAllButton();
}

function updateImageArea(slotIdx, rowIdx, areaEl) {
    var fileInput = areaEl.querySelector('input[type="file"]');
    var dot = areaEl.querySelector('.drop-dot'); // 保留藍點
    areaEl.innerHTML = '';
    
    if (fileInput) areaEl.appendChild(fileInput);
    if (dot) areaEl.appendChild(dot);

    var imgData = frameImages[slotIdx][rowIdx];

            updateImageArea(slotIdx, rowIdx, areaEl);
        };

function toggleSlot(slotIdx) {
    if (isPlaying) return;
    slotEnabled[slotIdx] = !slotEnabled[slotIdx];
    renderTopToggles();
    renderSlots();
    statusText.textContent = '已選取 ' + slotEnabled.filter(Boolean).length + ' 個卡槽';
}

function updateSelectAllButton() {
    selectAllBtn.textContent = slotEnabled.every(Boolean) ? '☑ 全選' : '☐ 全選';
}

function applyRhythmPattern(slotIdx, row, pattern) {
    for (var c = 0; c < COLS; c++) {
        var p = pattern[c];
        slotData[slotIdx][row][c] = (p === 'accent') ? 1 : (p === 'sustain' ? 2 : 0);
    }
    if (beatTuplets[slotIdx]) { delete beatTuplets[slotIdx][row]; if (Object.keys(beatTuplets[slotIdx]).length === 0) delete beatTuplets[slotIdx]; }
    if (mergePairs[slotIdx]) { mergePairs[slotIdx] = mergePairs[slotIdx].filter(function(p) { return p.row1 !== row && p.row2 !== row; }); if (mergePairs[slotIdx].length === 0) delete mergePairs[slotIdx]; }
    renderSlots();
    statusText.textContent = '✅ 卡槽 ' + (slotIdx + 1) + ' 第 ' + (row + 1) + ' 拍已設定';
}

// ================================================================
// 事件生成與播放
// ================================================================
function getSubInterval() { return (60000 / bpm) / 4 / 1000; }
function getBeatInterval() { return (60000 / bpm) / 1000; }
function getEnabledPositions() {
    var positions = [];
    for (var s = 0; s < TOTAL_SLOTS; s++) {
        if (!slotEnabled[s]) continue;
        for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) positions.push({ slot: s, row: r, col: c });
    }
    return positions;
}
function isAccent(slot, row, col) { 
    return slotData[slot] && slotData[slot][row] && slotData[slot][row][col] === 1; 
}

function generateEvents(positions, startTime) {
    var events = [], interval = getSubInterval(), totalPositions = positions.length, totalEvents = totalPositions * loopCount;
    for (var i = 0; i < totalEvents; i++) {
        var pos = positions[i % totalPositions];
        var time = startTime + i * interval;
        var slot = pos.slot, row = pos.row, col = pos.col;
        var mergePair = getMergePair(slot, row, col);

        if (mergePair) {
            var isStart = (row === mergePair.row1 && col === mergePair.col1);
            var isEnd = (row === mergePair.row2 && col === mergePair.col2);
            if (isStart) {
                var info = TUPLET_TYPES.find(function(t) { return t.id === mergePair.type; });
                var divisions = info ? parseInt(info.label) : 3;
                events.push({ time, slot, row, col, type: 'merge', divisions, subDuration: (interval * 2) / divisions, idx1: mergePair.row1 * COLS + mergePair.col1, idx2: mergePair.row2 * COLS + mergePair.col2 });
                continue;
            }
            if (isEnd) continue;
        }
        var tuplet = getCellTuplet(slot, row, col);
        if (tuplet) {
            var info2 = TUPLET_TYPES.find(function(t) { return t.id === tuplet; });
            var divisions2 = info2 ? parseInt(info2.label) : 3;
            events.push({ time, slot, row, col, type: 'tuplet', divisions: divisions2, subDuration: interval / divisions2, cellIdx: row * COLS + col, hasSound: true });
            continue;
        }
        events.push({ time, slot, row, col, type: 'normal', cellIdx: row * COLS + col, hasSound: isAccent(slot, row, col) });
    }
    return events;
}

function clearAllHighlights() {
    document.querySelectorAll('.cell.playing').forEach(function(el) { el.classList.remove('playing'); });
    document.querySelectorAll('.drop-dot.active').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.frame.playing-frame').forEach(function(el) { el.classList.remove('playing-frame'); });
}

function applyHighlight(event) {
    var slot = event.slot, row = event.row;
    var rowEl = slotRowContainer.querySelector('.slot-row[data-slot="' + slot + '"]');
    if (!rowEl) return;

    clearAllHighlights();

    var frameEl = rowEl.querySelector('.frame[data-slot="' + slot + '"][data-row="' + row + '"]');
    if (frameEl) frameEl.classList.add('playing-frame');

    var cells = rowEl.querySelectorAll('.frame[data-row="' + row + '"] .cell');
    
    if (event.type === 'merge') {
        if (event.idx1 % COLS < cells.length) cells[event.idx1 % COLS].classList.add('playing');
        if (event.idx2 % COLS < cells.length) cells[event.idx2 % COLS].classList.add('playing');
    } else {
        if (event.cellIdx % COLS < cells.length) cells[event.cellIdx % COLS].classList.add('playing');
    }

    var dot = rowEl.querySelector('.frame[data-row="' + row + '"] .drop-dot');
    if (dot) dot.classList.add('active');
}

function renderLoop() {
    if (!playState.isActive) return;
    var now = audioCtx.currentTime, index = playState.eventIndex;
    while (index < playState.events.length && playState.events[index].time < now + 0.01) {
        applyHighlight(playState.events[index]);
        index++;
    }
    playState.eventIndex = index;

    if (isPlaying && totalPositions > 0) {
        var currentLoop = Math.floor(index / totalPositions) + 1;
        if (currentLoop <= loopCount) {
            statusText.textContent = '▶ 播放中... ' + currentLoop + '/' + loopCount + ' 輪';
            statusText.className = 'status-text playing';
        }
    }

    if (index < playState.events.length) {
        playState.rafId = requestAnimationFrame(renderLoop);
    } else {
        playState.isActive = false;
        if (isPlaying) {
            isPlaying = false;
            playBtn.innerHTML = '▶ <span id="playLabel">播放</span>';
            playBtn.classList.remove('playing');
            statusText.textContent = '⏹ 播放完成 (' + loopCount + ' 輪)';
            statusText.className = 'status-text';
            clearAllHighlights();
            if (metroTimeoutId) { clearTimeout(metroTimeoutId); metroTimeoutId = null; }
        }
    }
}

function scheduleNextMetro() {
    if (!isPlaying || !metronomeOn) { metroTimeoutId = null; return; }
    metroTimeoutId = setTimeout(function() {
        if (!isPlaying || !metronomeOn) { metroTimeoutId = null; return; }
        playMetroAtTime(audioCtx.currentTime);
        metroBeatCounter++;
        scheduleNextMetro();
    }, getBeatInterval() * 1000 - 3);
}
function startMetro() {
    if (metroTimeoutId) clearTimeout(metroTimeoutId);
    metroBeatCounter = 0;
    if (isPlaying && metronomeOn) {
        playMetroAtTime(audioCtx.currentTime);
        metroBeatCounter = 1;
        scheduleNextMetro();
    }
}
function stopMetro() {
    if (metroTimeoutId) clearTimeout(metroTimeoutId);
    metroTimeoutId = null; metroBeatCounter = 0;
}

function playFromStart() {
    if (isPlaying) stopPlayback();
    initAudio();
    var positions = getEnabledPositions();
    if (positions.length === 0) { statusText.textContent = '⚠️ 沒有啟用的卡槽'; return; }
    totalPositions = positions.length;

    var hasSound = positions.some(function(p) { return isAccent(p.slot, p.row, p.col) || getCellTuplet(p.slot, p.row, p.col) || getMergePair(p.slot, p.row, p.col); });
    if (!hasSound) { statusText.textContent = '⚠️ 沒有重拍或連音'; return; }

    isPlaying = true;
    playBtn.innerHTML = '⏹ <span id="playLabel">停止</span>';
    playBtn.classList.add('playing');
    statusText.textContent = '▶ 準備中...';
    statusText.className = 'status-text playing';

    var ctx = audioCtx, beatInterval = getBeatInterval(), prepCount = 0;
    if (prepTimerId) clearInterval(prepTimerId);

    prepTimerId = setInterval(function() {
        if (prepCount >= 4) {
            clearInterval(prepTimerId); prepTimerId = null;
            setTimeout(function() {
                if (!isPlaying) return;
                var startTime = ctx.currentTime + 0.05;
                playState.events = generateEvents(positions, startTime);
                playState.eventIndex = 0;
                playState.startTime = startTime;
                playState.isActive = true;
                playState.scheduledNodes = [];

                playState.events.forEach(function(ev) {
                    if (ev.type === 'merge') {
                        for (var k = 0; k < ev.divisions; k++) playKickAtTime(ev.time + k * ev.subDuration);
                    } else if (ev.type === 'tuplet' && ev.hasSound) {
                        for (var k2 = 0; k2 < ev.divisions; k2++) playKickAtTime(ev.time + k2 * ev.subDuration);
                    } else if (ev.type === 'normal' && ev.hasSound) {
                        playKickAtTime(ev.time);
                    }
                });

                if (metronomeOn) startMetro();
                clearAllHighlights();
                statusText.textContent = '▶ 播放中... 1/' + loopCount + ' 輪';
                statusText.className = 'status-text playing';
                playState.rafId = requestAnimationFrame(renderLoop);
            }, 80);
            return;
        }
        playTickAtTime(ctx.currentTime);
        prepCount++;
        statusText.textContent = '▶ 準備 ' + prepCount + '/4';
    }, beatInterval * 1000);
}

function stopPlayback() {
    isPlaying = false; playState.isActive = false;
    if (playState.rafId) { cancelAnimationFrame(playState.rafId); playState.rafId = null; }
    stopMetro();

    if (playState.scheduledNodes) {
        playState.scheduledNodes.forEach(function(nodes) {
            try {
                if (nodes.osc) { nodes.osc.stop(0); nodes.osc.disconnect(); }
                if (nodes.gain) nodes.gain.disconnect();
                if (nodes.noise) { nodes.noise.stop(0); nodes.noise.disconnect(); }
                if (nodes.ng) nodes.ng.disconnect();
            } catch (e) {}
        });
        playState.scheduledNodes = [];
    }
    if (prepTimerId) { clearInterval(prepTimerId); prepTimerId = null; }
    clearAllHighlights();
    playBtn.innerHTML = '▶ <span id="playLabel">播放</span>';
    playBtn.classList.remove('playing');
    statusText.textContent = '⏹ 已停止';
    statusText.className = 'status-text';
    playState.events = []; playState.eventIndex = 0; totalPositions = 0;
}
function togglePlay() { if (isPlaying) stopPlayback(); else playFromStart(); }
function toggleMetro() {
    metronomeOn = !metronomeOn;
    metroToggleBtn.textContent = metronomeOn ? '開' : '關';
    metroToggleBtn.classList.toggle('on', metronomeOn);
    if (metronomeOn && isPlaying) startMetro(); else if (!metronomeOn) stopMetro();
}

// ================================================================
// 拖曳邏輯
// ================================================================
function initRhythmDrag() {
    rhythmToolBtn.addEventListener('mousedown', function(e) { e.preventDefault(); rhythmStartDrag(e.clientX, e.clientY); });
    rhythmToolBtn.addEventListener('touchstart', function(e) { e.preventDefault(); var t = e.touches[0]; rhythmStartDrag(t.clientX, t.clientY); }, { passive: false });
}
function rhythmStartDrag(x, y) {
    rhythmDrag.isDragging = true; rhythmDrag.active = true;
    rhythmToolBtn.classList.add('active');
    dragGhost.textContent = '🎵 常符'; dragGhost.classList.add('visible');
    dragGhost.style.left = (x + 12) + 'px'; dragGhost.style.top = (y + 12) + 'px';
    document.addEventListener('mousemove', rhythmOnDragMove);
    document.addEventListener('mouseup', rhythmOnDragEnd);
    document.addEventListener('touchmove', rhythmOnDragMove, { passive: false });
    document.addEventListener('touchend', rhythmOnDragEnd, { passive: false });
    statusText.textContent = '🖱️ 拖拉「常符」到藍色圓點';
}
function rhythmOnDragMove(e) {
    e.preventDefault();
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var y = e.touches ? e.touches[0].clientY : e.clientY;
    dragGhost.style.left = (x + 12) + 'px'; dragGhost.style.top = (y + 12) + 'px';
    document.querySelectorAll('.drop-dot.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
    var target = document.elementFromPoint(x, y);
    if (target) {
        var dot = target.closest('.drop-dot');
        if (dot && rhythmDrag.active) dot.classList.add('drag-over');
    }
}
function rhythmOnDragEnd(e) {
    document.removeEventListener('mousemove', rhythmOnDragMove);
    document.removeEventListener('mouseup', rhythmOnDragEnd);
    document.removeEventListener('touchmove', rhythmOnDragMove);
    document.removeEventListener('touchend', rhythmOnDragEnd);
    document.querySelectorAll('.drop-dot.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
    dragGhost.classList.remove('visible');
    rhythmToolBtn.classList.remove('active');
    var x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    var y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    setTimeout(function() {
        var target = document.elementFromPoint(x, y);
        if (target) {
            var dot = target.closest('.drop-dot');
            if (dot) {
                var slotIdx = parseInt(dot.getAttribute('data-slot'));
                var row = parseInt(dot.getAttribute('data-row'));
                if (!isNaN(slotIdx) && !isNaN(row) && slotEnabled[slotIdx]) showRhythmPicker(slotIdx, row);
            } else {
                var cell = target.closest('.cell');
                if (cell) statusText.textContent = '⚠️ 請拖拉到拍號左側藍色圓點';
            }
        }
        rhythmDrag.active = false; rhythmDrag.isDragging = false;
    }, 10);
}

function initTupletDrag() {
    tupletToolBtn.addEventListener('mousedown', function(e) { e.preventDefault(); tupletStartDrag(e.clientX, e.clientY); });
    tupletToolBtn.addEventListener('touchstart', function(e) { e.preventDefault(); var t = e.touches[0]; tupletStartDrag(t.clientX, t.clientY); }, { passive: false });
}
function tupletStartDrag(x, y) {
    tupletDrag.isDragging = true; tupletDrag.active = true;
    tupletTargetSlot = null; tupletTargetRow = null; tupletTargetCol = null;
    tupletToolBtn.classList.add('active');
    dragGhost.textContent = '🔀 連音組合'; dragGhost.classList.add('visible');
    dragGhost.style.left = (x + 12) + 'px'; dragGhost.style.top = (y + 12) + 'px';
    document.addEventListener('mousemove', tupletOnDragMove);
    document.addEventListener('mouseup', tupletOnDragEnd);
    document.addEventListener('touchmove', tupletOnDragMove, { passive: false });
    document.addEventListener('touchend', tupletOnDragEnd, { passive: false });
    statusText.textContent = '🖱️ 拖拉「連音組合」到單個格子';
}
function tupletOnDragMove(e) {
    e.preventDefault();
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var y = e.touches ? e.touches[0].clientY : e.clientY;
    dragGhost.style.left = (x + 12) + 'px'; dragGhost.style.top = (y + 12) + 'px';
    document.querySelectorAll('.cell.drag-highlight').forEach(function(el) { el.classList.remove('drag-highlight'); });
    var target = document.elementFromPoint(x, y);
    if (target) {
        var cell = target.closest('.cell');
        if (cell && tupletDrag.active) {
            var slotIdx = parseInt(cell.getAttribute('data-slot'));
            var row = parseInt(cell.getAttribute('data-row'));
            var col = parseInt(cell.getAttribute('data-col'));
            if (!isNaN(slotIdx) && !isNaN(row) && !isNaN(col) && slotEnabled[slotIdx]) {
                tupletTargetSlot = slotIdx; tupletTargetRow = row; tupletTargetCol = col;
                cell.classList.add('drag-highlight');
                statusText.textContent = '🔀 目標: 卡槽 ' + (slotIdx + 1) + ' 第 ' + (row + 1) + ' 拍第 ' + (col + 1) + ' 格';
            }
        } else {
            var dot = target.closest('.drop-dot');
            if (dot) statusText.textContent = '⚠️ 請拖拉到單個 16 分音符格子';
        }
    }
}
function tupletOnDragEnd(e) {
    document.removeEventListener('mousemove', tupletOnDragMove);
    document.removeEventListener('mouseup', tupletOnDragEnd);
    document.removeEventListener('touchmove', tupletOnDragMove);
    document.removeEventListener('touchend', tupletOnDragEnd);
    document.querySelectorAll('.cell.drag-highlight').forEach(function(el) { el.classList.remove('drag-highlight'); });
    dragGhost.classList.remove('visible'); tupletToolBtn.classList.remove('active');
    var x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    var y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    setTimeout(function() {
        if (tupletTargetSlot !== null && tupletTargetRow !== null && tupletTargetCol !== null) showTupletPicker(tupletTargetSlot, tupletTargetRow, tupletTargetCol);
        else {
            var target = document.elementFromPoint(x, y);
            if (target && target.closest('.drop-dot')) statusText.textContent = '⚠️ 請拖拉到單個 16 分音符格子';
        }
        tupletTargetSlot = null; tupletTargetRow = null; tupletTargetCol = null;
        tupletDrag.active = false; tupletDrag.isDragging = false;
    }, 10);
}

// ================================================================
// 彈窗
// ================================================================
function showRhythmPicker(slotIdx, row) {
    rhythmPickerGrid.innerHTML = '';
    RHYTHM_LIBRARY.forEach(function(pattern, idx) {
        var item = document.createElement('div');
        item.className = 'picker-item';
        item.textContent = pattern.map(function(p) { 
            return p === 'accent' ? '◉' : (p === 'sustain' ? '▬' : '○'); 
        }).join(' ');
        item.setAttribute('data-idx', idx);
        item.onclick = function() {
            applyRhythmPattern(slotIdx, row, RHYTHM_LIBRARY[parseInt(this.getAttribute('data-idx'))]);
            rhythmPicker.style.display = 'none';
        };
        rhythmPickerGrid.appendChild(item);
    });
    rhythmPicker.style.display = 'block';
    statusText.textContent = '🎵 選擇節奏 (卡槽 ' + (slotIdx + 1) + ' 第 ' + (row + 1) + ' 拍)';
}
rhythmPickerCancel.onclick = function() { rhythmPicker.style.display = 'none'; };

function showTupletPicker(slotIdx, row, col) {
    tupletPickerGrid.innerHTML = ''; mergeUpPickerGrid.innerHTML = ''; mergeDownPickerGrid.innerHTML = '';
    tupletPickerTitle.textContent = '🔀 連音設定 (卡槽 ' + (slotIdx + 1) + ' · 第 ' + (row + 1) + ' 拍第 ' + (col + 1) + ' 格)';
    
    TUPLET_TYPES.forEach(function(t) {
        var item = document.createElement('div');
        item.className = 'picker-item'; item.textContent = t.label + ' 連音';
        item.onclick = function() { applyBeatTuplet(slotIdx, row, col, t.id); };
        tupletPickerGrid.appendChild(item);
    });

    var canMergeUp = false, upRow = row, upCol = col - 1;
    if (col > 0) canMergeUp = true;
    else if (row > 0) { canMergeUp = true; upRow = row - 1; upCol = COLS - 1; }
    if (canMergeUp) {
        TUPLET_TYPES.forEach(function(t) {
            var item = document.createElement('div');
            item.className = 'picker-item merge-up'; item.textContent = '↑ ' + t.label;
            item.onclick = function() { applyMergeUp(slotIdx, row, col, upRow, upCol, t.id); };
            mergeUpPickerGrid.appendChild(item);
        });
    } else { var d = document.createElement('div'); d.className = 'picker-item disabled'; d.textContent = '🚫 無法向上'; mergeUpPickerGrid.appendChild(d); }

    var canMergeDown = false, downRow = row, downCol = col + 1;
    if (col < COLS - 1) canMergeDown = true;
    else if (row < ROWS - 1) { canMergeDown = true; downRow = row + 1; downCol = 0; }
    if (canMergeDown) {
        TUPLET_TYPES.forEach(function(t) {
            var item = document.createElement('div');
            item.className = 'picker-item merge-down'; item.textContent = '↓ ' + t.label;
            item.onclick = function() { applyMergeDown(slotIdx, row, col, downRow, downCol, t.id); };
            mergeDownPickerGrid.appendChild(item);
        });
    } else { var d2 = document.createElement('div'); d2.className = 'picker-item disabled'; d2.textContent = '🚫 無法向下'; mergeDownPickerGrid.appendChild(d2); }

    tupletPicker.style.display = 'block';
    statusText.textContent = '🔀 選擇連音 (卡槽 ' + (slotIdx + 1) + ' 第 ' + (row + 1) + ' 拍第 ' + (col + 1) + ' 格)';
}
tupletPickerCancel.onclick = function() { tupletPicker.style.display = 'none'; };

function applyBeatTuplet(slotIdx, row, col, tupletId) {
    removeMergePair(slotIdx, row, col);
    if (!beatTuplets[slotIdx]) beatTuplets[slotIdx] = {};
    if (!beatTuplets[slotIdx][row]) beatTuplets[slotIdx][row] = {};
    beatTuplets[slotIdx][row][col] = tupletId;
    slotData[slotIdx][row][col] = 1;
    renderSlots(); tupletPicker.style.display = 'none';
    var info = TUPLET_TYPES.find(function(t) { return t.id === tupletId; });
    statusText.textContent = '✅ 卡槽 ' + (slotIdx + 1) + ' 第 ' + (row + 1) + ' 拍第 ' + (col + 1) + ' 格 → ' + (info ? info.label : '') + ' 連音';
}

function applyMergeUp(slotIdx, row, col, upRow, upCol, tupletId) {
    if (beatTuplets[slotIdx]) {
        if (beatTuplets[slotIdx][row] && beatTuplets[slotIdx][row][col] !== undefined) delete beatTuplets[slotIdx][row][col];
        if (beatTuplets[slotIdx][upRow] && beatTuplets[slotIdx][upRow][upCol] !== undefined) delete beatTuplets[slotIdx][upRow][upCol];
    }
    removeMergePairWithCells(slotIdx, row, col, upRow, upCol);
    var r1, c1, r2, c2;
    if (row < upRow || (row === upRow && col < upCol)) { r1 = row; c1 = col; r2 = upRow; c2 = upCol; }
    else { r1 = upRow; c1 = upCol; r2 = row; c2 = col; }
    addMergePair(slotIdx, r1, c1, r2, c2, tupletId);
    slotData[slotIdx][row][col] = 1; slotData[slotIdx][upRow][upCol] = 1;
    renderSlots(); tupletPicker.style.display = 'none';
    statusText.textContent = '✅ 已設定向上合併';
}

function applyMergeDown(slotIdx, row, col, downRow, downCol, tupletId) {
    if (beatTuplets[slotIdx]) {
        if (beatTuplets[slotIdx][row] && beatTuplets[slotIdx][row][col] !== undefined) delete beatTuplets[slotIdx][row][col];
        if (beatTuplets[slotIdx][downRow] && beatTuplets[slotIdx][downRow][downCol] !== undefined) delete beatTuplets[slotIdx][downRow][downCol];
    }
    removeMergePairWithCells(slotIdx, row, col, downRow, downCol);
    var r1, c1, r2, c2;
    if (row < downRow || (row === downRow && col < downCol)) { r1 = row; c1 = col; r2 = downRow; c2 = downCol; }
    else { r1 = downRow; c1 = downCol; r2 = row; c2 = col; }
    addMergePair(slotIdx, r1, c1, r2, c2, tupletId);
    slotData[slotIdx][row][col] = 1; slotData[slotIdx][downRow][downCol] = 1;
    renderSlots(); tupletPicker.style.display = 'none';
    statusText.textContent = '✅ 已設定向下合併';
}

document.addEventListener('click', function(e) {
    if (rhythmPicker.style.display === 'block' && !rhythmPicker.contains(e.target)) rhythmPicker.style.display = 'none';
    if (tupletPicker.style.display === 'block' && !tupletPicker.contains(e.target)) tupletPicker.style.display = 'none';
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        rhythmPicker.style.display = 'none'; tupletPicker.style.display = 'none';
    }
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
});

// ================================================================
// 其他控制項
// ================================================================
function randomGrid() {
    if (isPlaying) stopPlayback();
    beatTuplets = {}; mergePairs = {};
    for (var s = 0; s < TOTAL_SLOTS; s++)
        for (var r = 0; r < ROWS; r++)
            for (var c = 0; c < COLS; c++) {
                slotData[s][r][c] = Math.floor(Math.random() * 3);
            }
    renderSlots(); statusText.textContent = '🎲 已隨機';
}

function clearGrid() {
    if (isPlaying) stopPlayback();
    beatTuplets = {}; mergePairs = {};
    for (var s = 0; s < TOTAL_SLOTS; s++)
        for (var r = 0; r < ROWS; r++)
            for (var c = 0; c < COLS; c++) slotData[s][r][c] = 0;
    renderSlots(); statusText.textContent = '🗑 已清空節奏';
}

function toggleAllSlots() {
    if (isPlaying) return;
    var allEnabled = slotEnabled.every(Boolean);
    for (var i = 0; i < TOTAL_SLOTS; i++) slotEnabled[i] = !allEnabled;
    renderTopToggles();
    renderSlots(); 
    statusText.textContent = allEnabled ? '已取消全選' : '已全選';
}

playBtn.onclick = togglePlay;
metroToggleBtn.onclick = toggleMetro;
randomBtn.onclick = randomGrid;
clearBtn.onclick = clearGrid;
selectAllBtn.onclick = toggleAllSlots;
loopCountSelect.onchange = function() { loopCount = parseInt(this.value); };
bpmSlider.oninput = function() { bpm = parseInt(this.value); bpmDisplay.textContent = bpm; if (isPlaying) { stopPlayback(); setTimeout(playFromStart, 100); } };
volumeSlider.oninput = function() { volume = parseInt(this.value) / 100; volumeDisplay.textContent = Math.round(volume * 100) + '%'; if(masterGain) masterGain.gain.value = volume; };
metroVolumeSlider.oninput = function() { metroVolume = parseInt(this.value) / 100; metroVolDisplay.textContent = Math.round(metroVolume * 100) + '%'; if(metroGain) metroGain.gain.value = metroVolume * 0.4; };
document.addEventListener('click', function() { initAudio(); }, { once: true });

// 初始化
initRhythmDrag();
initTupletDrag();
renderTopToggles();
renderSlots();
statusText.textContent = '⏸ 就緒';
</script>
</body>
</html>
